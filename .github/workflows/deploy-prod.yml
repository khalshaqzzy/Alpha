name: Deploy Backend to Production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/deploy-prod.yml"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: SSH into alpha-prod and deploy
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: alpha-prod
          zone: ${{ secrets.GCP_ZONE }}
          ssh_private_key: ${{ secrets.GCP_SSH_KEY }}
          command: |
            cd /opt/alpha
            bash scripts/deploy.sh main

      - name: Verify deployment health
        run: |
          echo "Waiting 10s for services to stabilize..."
          sleep 10
          HEALTH=$(curl -sf --max-time 15 https://prod.cryptoalpha.site/api/health || echo "UNREACHABLE")
          echo "Health check response: $HEALTH"
          if echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "✅ Production deployment healthy!"
          else
            echo "❌ Production health check failed: $HEALTH"
            exit 1
          fi
