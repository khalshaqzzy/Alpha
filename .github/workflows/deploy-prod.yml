name: Deploy Backend to Production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/deploy-prod.yml"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git config --global --add safe.directory /opt/alpha
            cd /opt/alpha
            bash scripts/deploy.sh main

      - name: Verify deployment health
        run: |
          echo "Waiting 10s for services to stabilize..."
          sleep 10
          HEALTH=$(curl -sf --max-time 15 https://prod.cryptoalpha.site/api/health || echo "UNREACHABLE")
          echo "Health check response: $HEALTH"
          if echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "✅ Production deployment healthy!"
          else
            echo "❌ Production health check failed: $HEALTH"
            exit 1
          fi
