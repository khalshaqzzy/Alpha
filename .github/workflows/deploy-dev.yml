name: Deploy Backend to Development

on:
  push:
    branches: [dev] # dev branch only
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/deploy-dev.yml"

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git config --global --add safe.directory /opt/alpha
            cd /opt/alpha
            bash scripts/deploy.sh dev

      - name: Verify deployment health
        run: |
          echo "Waiting 10s for services to stabilize..."
          sleep 10
          HEALTH=$(curl -sf --max-time 15 https://dev.cryptoalpha.site/api/health || echo "UNREACHABLE")
          echo "Health check response: $HEALTH"
          if echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "✅ Development deployment healthy!"
          else
            echo "❌ Development health check failed: $HEALTH"
            exit 1
          fi
